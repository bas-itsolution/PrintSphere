<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrintSphere LCD 1.85C Flash</title>
    <script
      type="module"
      src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
    ></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f7fb;
        color: #142033;
      }

      main {
        width: min(680px, calc(100vw - 32px));
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        line-height: 1.55;
      }

      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(20, 32, 51, 0.08);
      }

      .panel {
        display: grid;
        gap: 14px;
        padding: 24px;
        border: 1px solid rgba(20, 32, 51, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
      }

      esp-web-install-button {
        justify-self: start;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101722;
          color: #edf4ff;
        }

        .panel {
          border-color: rgba(237, 244, 255, 0.16);
          background: rgba(21, 31, 45, 0.92);
        }

        code {
          background: rgba(237, 244, 255, 0.1);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PrintSphere для ESP32-S3-Touch-LCD-1.85C Rev2.0</h1>
      <section class="panel">
        <p>Эта страница прошивает только образ для платы 1.85C Rev2.0.</p>
        <esp-web-install-button id="install-button">
          <button slot="activate">Install LCD 1.85C firmware</button>
        </esp-web-install-button>
        <p>Файл: <code>release/1.85c/initial/printsphere_full-layout-touch-clouddiag-v7.bin</code></p>
        <p>SHA256: <code>CE5D58DE60831D80B1B0BD5679D04A320141841D5E45BD617D24169698B48F08</code></p>
      </section>
    </main>

    <script>
      const imageUrl = new URL(
        "../release/1.85c/initial/printsphere_full-layout-touch-clouddiag-v7.bin?v=layout-touch-clouddiag-v7",
        window.location.href,
      ).href;
      const manifest = {
        name: "PrintSphere LCD 1.85C Rev2.0",
        version: "v1.6.2-1.85C",
        new_install_prompt_erase: false,
        new_install_improv_wait_time: 30,
        builds: [
          {
            chipFamily: "ESP32-S3",
            parts: [{ path: imageUrl, offset: 0 }],
          },
        ],
      };
      const manifestUrl = URL.createObjectURL(
        new Blob([JSON.stringify(manifest)], { type: "application/json" }),
      );
      document.querySelector("#install-button").setAttribute("manifest", manifestUrl);
    </script>
  </body>
</html>
